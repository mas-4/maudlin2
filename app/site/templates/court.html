{% extends "page.html" %}
{% import "boards.html" as b %}

{# A case's or story's card (index.js hoverCard, from a <template> per strip row): the sliders, feelings, quotes and
   outlets that were on the old cards, with no tooltips of their own inside it #}
{% macro meters(a) %}
    <div class="meters court-pop-meters">
        {% for feeling in a.feelings %}
            <span class="story-feeling"><span class="badge-emoji">{{ feeling['emoji'] }}</span>{{ feeling['name']|e }} {{ feeling['share']|e }}%</span>
        {% endfor %}
        <div class="meter">
            <span class="meter-label">covered by</span>
            <span class="meter-bar"><span class="meter-end" aria-hidden="true">🫏</span>
                <span class="meter-track lean-track"><span class="meter-dot" style="left: {{ a.lean.position|e }}%"></span></span>
                <span class="meter-end" aria-hidden="true">🐘</span></span>
        </div>
        <div class="meter">
            <span class="meter-label">mood</span>
            <span class="meter-bar"><span class="meter-end" aria-hidden="true">⛈️</span>
                <span class="meter-track mood-track"><span class="meter-dot" style="left: {{ a.mood.position|e }}%"></span></span>
                <span class="meter-end" aria-hidden="true">☀️</span></span>
        </div>
        {% if a.spice_position is not none %}
        <div class="meter">
            <span class="meter-label">spice</span>
            <span class="meter-bar"><span class="meter-end" aria-hidden="true">🍞</span>
                <span class="meter-track spice-track"><span class="meter-dot" style="left: {{ a.spice_position|e }}%"></span></span>
                <span class="meter-end" aria-hidden="true">🌶️</span></span>
        </div>
        {% endif %}
    </div>
    <p class="court-pop-line">⚖️ lean {{ a.lean.text|e }} against all the Court coverage · {{ a.mood.emoji }} {{ a.mood.word|e }}{% if a.spice is not none %} · 🌶️ spice {{ a.spice|e }} (0 plain to 2 loaded){% endif %}</p>
{% endmacro %}

{% macro pop(id, a, title, meta='') %}<template id="{{ id|e }}"><div class="court-pop">
    <h3>{{ title|e }}</h3>
    {% if meta %}<p class="court-pop-meta">{{ meta|e }}</p>{% endif %}
    <p class="court-pop-line">📰 {{ a.outlets }} outlet{{ 's' if a.outlets != 1 }}: {{ a.who|e }}</p>
    {% if a.reported %}<p class="court-pop-line"><b>Its headlines were about</b> (our model's reading of each): {{ a.reported|e }}</p>{% endif %}
    {{ meters(a) }}
    {% if a.quotes %}<p class="court-pop-line">💬 quoted: {% for q in a.quotes %}<span class="quote-chip quote-{{ q.lead|e }}">“{{ q.phrase|e }}”{% if q.count > 1 %} <b>{{ q.count }}</b>{% endif %}</span> {% endfor %}</p>{% endif %}
    <div class="story-outlets">{% for c in a.chips %}<a class="storylink" href="{{ c.url|e }}" style="{{ c.style|e }}">{{ outlet_icon(c.agency) }}{{ c.short|e }}</a>{% endfor %}</div>
    {{ caller() if caller is defined else '' }}
</div></template>{% endmacro %}

{% macro framing(a) %}
    {% if a.framing %}
        <div class="court-framing">
            {% for side, emoji in (('left', '🫏'), ('right', '🐘')) %}
                {% set h = a.framing[side] %}
                <a class="court-frame court-frame-{{ side|e }}" href="{{ h.url|e }}">
                    <span class="court-frame-side">{{ emoji }} {{ side }}-leaning</span>
                    <span class="court-frame-title">“{{ h.title|e }}”</span>
                    <span class="edit-chip" style="{{ h.style|e }}">{{ outlet_icon(h.agency) }}{{ short_name(h.agency) }}</span>
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p class="court-when court-one-side">{% if a.counts.get('left') %}🫏 Only left-leaning outlets{% elif a.counts.get('right') %}🐘 Only right-leaning outlets{% else %}⚖️ No left- or right-leaning outlet{% endif %} ran a headline on it, so there's no pair to set side by side.</p>
    {% endif %}
{% endmacro %}

{% macro headline_list(rows) %}
    <ul class="court-headlines">
        {% for h in rows %}
            <li><span class="court-stage" role="img" aria-label="{{ h.stage|e }}">{{ h.emoji }}</span>
                <span class="edit-chip" style="{{ h.style|e }}">{{ outlet_icon(h.agency) }}{{ short_name(h.agency) }}</span>
                <a href="{{ h.url|e }}">{{ h.title|e }}</a>
                <span class="court-when">{{ h.when }}</span></li>
        {% endfor %}
    </ul>
{% endmacro %}

{% block content %}
    <h2>⚖️ The Supreme Court</h2>
    <p class="poll-note">{% if term %}October Term {{ term }}: {% endif %}{{ n_cases }} cases on the docket, {{ cards|length }}
        in the news, from {{ total }} headlines about the Court in the last {{ window_days }} days.
        {% if argued_soon %}Argued this week:
            {% for c in argued_soon %}<a href="{% if c.headlines %}#case-{{ c.docket|e }}{% else %}{{ c.docket_url|e }}{% endif %}">{{ (c.gloss or c.name)|e }}</a> ({{ c.argued_text }}){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}</p>
    <details class="how-it-works">
        <summary>How this works</summary>
        <p class="poll-note">The cases come from the Court's own
            {% if source %}<a href="{{ source|e }}">Granted &amp; Noted list</a>{% else %}Granted &amp; Noted list{% endif %};
            what each is about comes from its question presented on Wikipedia's
            <a href="https://en.wikipedia.org/wiki/{{ wiki|replace(' ', '_') }}">{{ wiki }}</a> (CC BY-SA 4.0), which our
            local language model puts in a few plain words. Both are checked weekly. Where a case stands
            ({% for s, v in case_stages.items() %}{{ v.emoji }} {{ s }}: {{ v.about }}{% if not loop.last %}; {% endif %}{% endfor %})
            comes from its dates on that list; it doesn't say when a case is decided.</p>
        <p class="poll-note">Headlines that name the Court or a justice are read by the model with the outlet and its
            country: whether each is about the US Supreme Court, which of the term's cases it's about, a few topic
            words, and what it reports
            ({% for stage, emoji in stage_emoji.items() %}{{ emoji }} {{ stage_words.get(stage, stage) }}{% if not loop.last %}, {% endif %}{% endfor %}).
            A headline joins a case only if it shares a word specific to that case (its parties, place or subject)
            and the model, asked again about that case alone, agrees. The lean meter is against all the Court
            coverage, with each outlet counted once per case; each side's framing is its most loaded headline.</p>
    </details>

    {# The same section rail as the front page: any section a tap away, the one on screen lit #}
    <button class="toc-toggle" type="button" aria-label="Jump to a section" aria-expanded="false">🧭</button>
    <nav class="page-toc" aria-label="On this page">
        {% if cards %}<a href="#court-cases"><span class="toc-emoji">⚖️</span><span class="toc-label">cases in the news</span></a>{% endif %}
        {% if stories %}<a href="#court-stories"><span class="toc-emoji">📰</span><span class="toc-label">also at the Court</span></a>{% endif %}
        {% if topics %}<a href="#court-singles"><span class="toc-emoji">🗞️</span><span class="toc-label">single headlines</span></a>{% endif %}
        {% if cards or stories %}<a href="#court-pairs"><span class="toc-emoji">🫏</span><span class="toc-label">left vs right</span></a>{% endif %}
        <a href="#court-term"><span class="toc-emoji">📜</span><span class="toc-label">the term's cases</span></a>
    </nav>
    <script>
        (function () {
            const links = [...document.querySelectorAll('.page-toc a[href^="#"]')];
            const target = (a) => document.querySelector(a.getAttribute('href'));
            links.forEach((a) => a.addEventListener('click', (ev) => {
                const el = target(a);
                if (!el) return;
                ev.preventDefault();
                el.scrollIntoView({behavior: 'smooth', block: 'start'});
            }));
            const nav = document.querySelector('.page-toc'), toggle = document.querySelector('.toc-toggle');
            const fold = (open) => { nav.classList.toggle('open', open); toggle.setAttribute('aria-expanded', open); };
            toggle.addEventListener('click', () => fold(!nav.classList.contains('open')));
            document.body.classList.add('toc-on');
            fold(innerWidth > 700);
            let ticking = false;
            const mark = () => {
                ticking = false;
                let current = links[0];
                links.forEach((a) => { const el = target(a); if (el && el.getBoundingClientRect().top < innerHeight / 3) current = a; });
                links.forEach((a) => a.classList.toggle('here', a === current));
            };
            addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(mark); } }, {passive: true});
            addEventListener('load', mark);
        })();
    </script>

    {% if cards %}
        <h2 class="section-divider stage-banner" id="court-news" style="--stage: #ffc400"><span>📰 The Court in the news</span></h2>
        <p class="stage-sub">ranked by how many outlets ran a headline on it; point at a row for its card: the outlets,
            the mood and spice of its headlines, what they quoted</p>
        <section class="court-strip court-strip-cases" id="court-cases" aria-label="Cases in the news">
            {{ b.key(stage_key, 'Where each case stands') }}
            {{ b.board(strips.cases, 'h2') }}
            <div class="court-pops" data-board="court-cases">{% for c in cards %}{{ pop('court-pop-court-cases-' ~ loop.index0, c, c.title,
                c.name ~ ' · No. ' ~ (c.dockets or [c.docket])|join(', ') ~ ' · ' ~ c.case_stage ~ (' ' ~ c.argued_text if c.argued_text else '')) }}{% endfor %}</div>
        </section>
    {% endif %}

    {% if stories or topics %}
        <section class="court-strip court-strip-other" aria-label="The other Court news">
            {{ b.key(kind_key, 'What its headlines mostly report') }}
            <div class="rank-boards">
                {% if stories %}<div class="court-slot" id="court-stories">{{ b.board(strips.stories) }}
                    <div class="court-pops" data-board="court-stories">{% for t in stories %}{{ pop('court-pop-court-stories-' ~ loop.index0, t, t.title, ('“' ~ t.lead.title ~ '”') if t.name else '') }}{% endfor %}</div></div>{% endif %}
                {% if topics %}<div class="court-slot" id="court-singles">{{ b.board(strips.singles) }}
                    <div class="court-pops" data-board="court-singles">{% for t in topics %}{% call pop('court-pop-court-singles-' ~ loop.index0, t, t.title) %}{{ headline_list(t.rows) }}{% endcall %}{% endfor %}</div></div>{% endif %}
            </div>
        </section>
    {% endif %}

    {% if cards or stories %}
        <section class="court-pairs" aria-labelledby="court-pairs">
            <h2 class="section-divider stage-banner" id="court-pairs" style="--stage: #3a86ff"><span>🫏 vs 🐘 How each side headlined it</span></h2>
            <p class="stage-sub">for each case and story, the most loaded left-leaning headline beside the most loaded right-leaning one</p>
            <div class="court-pair-list">
                {% for c in cards %}
                    <article class="court-case" id="{{ c.anchor|e }}" style="--stage-ink: {{ case_stages[c.case_stage].ink|e }}">
                        <h3><span class="court-case-mark" role="img" aria-label="{{ c.case_stage|e }}">{{ case_stages[c.case_stage].emoji }}</span> {{ c.title|e }}</h3>
                        <p class="court-meta"><a href="{{ c.docket_url|e }}">{{ c.name|e }}</a> · No. {{ (c.dockets or [c.docket])|join(', ') }}{% if c.dockets and c.dockets|length > 1 %} · companion cases: one question, argued together{% endif %}
                            {% if c.argued_text %} · {% if c.argued_past %}argued{% else %}to be argued{% endif %} {{ c.argued_text }}{% endif %} · 📰 {{ c.outlets }} outlet{{ 's' if c.outlets != 1 }}</p>
                        {{ framing(c) }}
                        <details class="court-more"><summary>all {{ c.rows|length }} headline{{ 's' if c.rows|length != 1 }}</summary>{{ headline_list(c.rows) }}</details>
                    </article>
                {% endfor %}
                {% for t in stories %}
                    <article class="court-case" id="{{ t.anchor|e }}" style="--stage-ink: {{ news_kinds[t.kind].ink|e }}">
                        <h3><span class="court-case-mark" role="img" aria-label="{{ news_kinds[t.kind].name|e }}">{{ news_kinds[t.kind].emoji }}</span> {{ t.title|e }}</h3>
                        {% if t.name %}<p class="court-meta">“{{ t.lead.title|e }}” · 📰 {{ t.outlets }} outlets</p>{% endif %}
                        {{ framing(t) }}
                        <details class="court-more"><summary>all {{ t.rows|length }} headlines</summary>{{ headline_list(t.rows) }}</details>
                    </article>
                {% endfor %}
            </div>
        </section>
    {% endif %}

    <script>
        // Each strip row's card: its case's or story's <template>, by the row's place in its list
        window.hoverCard.register('.court-strip .rank-row', (el) => {
            const board = el.closest('.rank-board'), key = board && [...board.classList].find((c) => c.startsWith('rank-board-court'));
            if (!key) return null;
            const i = [...board.querySelectorAll('.rank-row')].indexOf(el);
            const t = document.getElementById(`court-pop-${key.slice('rank-board-'.length)}-${i}`);
            return t ? t.content.cloneNode(true) : null;
        });
    </script>

    <h3 id="court-term">The term's cases</h3>
    <p class="poll-note">Every case on the docket with what it's about. Solid: in the news in the last
        {{ window_days }} days (jumps to its headlines when it has a row above). Dashed: nobody we follow has covered it.</p>
    <div class="table-filters court-term-sort" role="group" aria-label="Order the term’s cases">
        <span>order:</span>
        <button type="button" data-order="date" class="active">🗓️ by argument date</button>
        <button type="button" data-order="covered">📰 most covered first</button>
    </div>
    <div class="court-uncovered" id="court-term-list">
        {% for c in term_cases %}
            <a class="court-quiet{% if c.outlets %} covered{% endif %}" data-outlets="{{ c.outlets|e }}" data-date="{{ loop.index0|e }}" href="{% if c.outlets >= min_card %}#case-{{ c.docket|e }}{% else %}{{ c.docket_url|e }}{% endif %}" data-tip-head="{{ c.name|e }}, No. {{ c.docket|e }}" data-tip="{{ (c.question[:300] if c.question else 'No question presented on file')|e }}">
                {% if c.gloss %}<span class="court-gloss-tag">{{ c.gloss|e }}</span>{% endif %}
                <span class="court-quiet-name">{{ c.name|e }}</span>
                <span class="court-when">No. {{ (c.dockets or [c.docket])|join(', ') }}{% if c.argued_text %} · {% if c.argued_past %}argued{% else %}to be argued{% endif %} {{ c.argued_text }}{% endif %}
                    · {% if c.outlets %}📰 {{ c.outlets }} outlet{{ 's' if c.outlets != 1 }}{% else %}no coverage{% endif %}</span>
            </a>
        {% endfor %}
    </div>
    <script>
        (function () {
            // The term's cases: by argument date, or most covered first
            const list = document.getElementById('court-term-list');
            document.querySelectorAll('.court-term-sort button').forEach((b) => b.addEventListener('click', () => {
                const slips = [...list.children];
                const num = (el, k) => parseFloat(el.dataset[k]);
                slips.sort(b.dataset.order === 'covered'
                    ? (x, y) => num(y, 'outlets') - num(x, 'outlets') || num(x, 'date') - num(y, 'date')
                    : (x, y) => num(x, 'date') - num(y, 'date'));
                slips.forEach((el) => list.appendChild(el));
                document.querySelectorAll('.court-term-sort button').forEach((o) => o.classList.toggle('active', o === b));
            }));
        })();
    </script>
{% endblock %}
