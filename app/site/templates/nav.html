<nav class="navbar">
    <a class="nav-brand" href="index.html">🗞️ bignews.day</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">☰</button>
    <div class="nav-links" id="nav-links">
        <a href="headlines.html">every headline</a>
        <a href="agencies.html">outlets</a>
        {# Trackers: a menu of the pages of running measures, opened on hover or tap #}
        <details class="nav-menu">
            <summary>trackers</summary>
            <div class="nav-menu-list">
                {% for t in trackers %}<a href="{{ t.href }}"><span class="nav-menu-emoji" aria-hidden="true">{{ t.emoji }}</span><span><b>{{ t.name }}</b><small>{{ t.about }}</small></span></a>{% endfor %}
            </div>
        </details>
        <a href="glossary.html">how it works</a>
    </div>
    <span class="updated" data-built="{{ built_at }}" title="When this page was last rebuilt">updated {{ built_at_text }}</span>
    <script>
        (function () {
            // "updated 12 min ago", kept current while the page is open; turns orange when the site has gone stale
            const el = document.currentScript.previousElementSibling;
            function tick() {
                const minutes = Math.max(0, Math.round((Date.now() - Date.parse(el.dataset.built)) / 60000));
                const hours = Math.floor(minutes / 60);
                el.textContent = 'updated ' + (minutes < 1 ? 'just now' : minutes < 60 ? minutes + ' min ago'
                    : hours + ' hour' + (hours === 1 ? '' : 's') + ' ago');
                el.classList.toggle('stale', minutes > 150);
            }
            tick();
            setInterval(tick, 30000);

            // The nav is rendered once for every page, so the current page is marked here
            const nav = el.parentElement;
            const page = location.pathname.split('/').pop() || 'index.html';
            nav.querySelectorAll('.nav-links a').forEach((a) => {
                if (a.getAttribute('href') === page) a.setAttribute('aria-current', 'page');
            });
            // The trackers menu: lit when the page is one of its own; opens on hover where there's a mouse, closes
            // on a click elsewhere or Escape
            const menu = nav.querySelector('.nav-menu');
            if (menu) {
                if (menu.querySelector('a[aria-current]')) menu.classList.add('current');
                if (matchMedia('(hover: hover)').matches) {
                    menu.addEventListener('mouseenter', () => { menu.open = true; });
                    menu.addEventListener('mouseleave', () => { menu.open = false; });
                    // Hovering already opened it, so a click keeps it open rather than toggling it shut
                    menu.querySelector('summary').addEventListener('click', (ev) => { ev.preventDefault(); menu.open = true; });
                }
                document.addEventListener('click', (ev) => { if (!menu.contains(ev.target)) menu.open = false; });
                document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') menu.open = false; });
            }

            // Phone-width menu
            const toggle = nav.querySelector('.nav-toggle');
            toggle.addEventListener('click', () => {
                const open = nav.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open);
                toggle.textContent = open ? '✕' : '☰';
            });
        })();
    </script>
</nav>
