name: Smoke check

# The test suite needs a populated database, so CI only checks what can break without one: every module compiles,
# and the C clustering extension builds and clusters correctly on the Python the site runs on.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Build the C extension
      run: |
        python -m pip install --upgrade pip
        pip install numpy setuptools
        python setup.py build_ext --inplace

    - name: Compile every module
      run: python -m compileall -q app main.py

    - name: Clustering works
      run: |
        python - <<'PY'
        import glob, importlib.util
        import numpy as np
        # load the built extension directly: importing the app package would set up NLTK and the rest
        spec = importlib.util.spec_from_file_location('maudlinlib', glob.glob('app/analysis/maudlinlib*.so')[0])
        lib = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(lib)
        form_clusters = lib.form_clusters
        # two obvious groups of three, and a loner
        sim = np.eye(7)
        for group in ([0, 1, 2], [3, 4, 5]):
            for i in group:
                for j in group:
                    sim[i, j] = 0.9
        clusters = sorted(sorted(c) for c in form_clusters(np.ascontiguousarray(sim, dtype=np.float64), 2, 0.7))
        assert clusters == [[0, 1, 2], [3, 4, 5]], clusters
        print("clusters:", clusters)
        PY
