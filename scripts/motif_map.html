<meta charset="utf-8">
<title>Motif Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: a front-page banner, one row of controls, then the map card beside its reading panel (stacked on phones).
   Light only, as the site is (docs/style-book.md): ink outlines, hard colored shadows, a little tilt. */
:root {
  --ink: #1f1f2e;
  --paper: #ffffff;
  --text: #555560;
  --soft: #f3f3f7;
  --line: #d6d6e0;
  --pink: #ff4fa3;
  --yellow: #ffc400;
  --teal: #00c2a8;
  --purple: #8a5cff;
  --shout: 'Bungee', 'Impact', sans-serif;
  --talk: 'Comic Neue', 'Comic Sans MS', cursive;
  --read: Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink);
  font: 15px/1.5 var(--read);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 1400px; margin: 0 auto; display: grid; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.banner {
  font: 26px/1 var(--shout); letter-spacing: 0.02em; margin: 0;
  background: var(--teal); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px;
  padding: 8px 18px 6px; box-shadow: 4px 4px 0 var(--ink); transform: rotate(-2deg);
}
.lede { font: 700 16px/1.4 var(--talk); margin: 0; max-width: 62ch; text-wrap: balance; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip {
  font: 700 14px/1 var(--talk); color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); border-radius: 999px; padding: 7px 12px; cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink); transition: transform .12s, box-shadow .12s;
}
.pill:hover, .chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.pill[aria-pressed="true"] { background: var(--yellow); }
.chip[aria-pressed="true"] { background: var(--pink); color: var(--ink); }
.pill:focus-visible, .chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid var(--purple); outline-offset: 2px;
}
.swatch { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%;
  vertical-align: -1px; margin-right: 4px; }
input[type="search"], select {
  font: 700 14px/1 var(--talk); color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; min-width: 0;
}
input[type="search"] { width: 15em; max-width: 100%; }
select { max-width: 100%; }
label.tick { font: 700 14px/1 var(--talk); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
label.tick input { accent-color: var(--pink); width: 16px; height: 16px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
@media (max-width: 960px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.mapcard {
  position: relative; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper);
  box-shadow: 6px 6px 0 var(--teal); overflow: hidden; height: clamp(380px, 70vh, 820px); touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.over { cursor: pointer; }
.zoombtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoombtns button {
  width: 34px; height: 34px; font: 700 18px/1 var(--talk); background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 10px; box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
}
.tip {
  position: absolute; pointer-events: none; max-width: 300px; background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--yellow);
  padding: 7px 10px; font: 13px/1.35 var(--read);
}
.tip b { font: 700 14px/1.2 var(--talk); display: block; }
.legend {
  position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: calc(100% - 20px);
  background: color-mix(in srgb, var(--paper) 88%, transparent); border-radius: 10px; padding: 6px 8px;
  font: 700 12px/1.2 var(--talk);
}
.counts { position: absolute; left: 10px; top: 10px; font: 700 12px/1.2 var(--talk); color: var(--text);
  background: color-mix(in srgb, var(--paper) 88%, transparent); border-radius: 8px; padding: 4px 6px; }

.panel {
  border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); box-shadow: 6px 6px 0 var(--pink);
  padding: 16px 16px 18px; display: grid; gap: 12px; min-width: 0;
  max-height: clamp(380px, 70vh, 820px); overflow-y: auto;
}
@media (max-width: 960px) { .panel { max-height: none; } }
.panel h2 { font: 700 22px/1.2 var(--talk); margin: 0; text-wrap: balance; }
.panel h3 { font: 14px/1.2 var(--shout); letter-spacing: 0.04em; margin: 6px 0 0; }
.panel p { margin: 0; color: var(--text); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 700 13px/1 var(--talk); }
.tag {
  border: 2px solid var(--ink); border-radius: 999px; padding: 4px 9px; background: var(--soft);
  white-space: nowrap;
}
.tag.tilt { transform: rotate(-3deg); box-shadow: 2px 2px 0 var(--yellow); background: var(--paper); }
.back {
  justify-self: start; font: 700 13px/1 var(--talk); background: none; border: none; color: var(--ink);
  text-decoration: underline; padding: 0; cursor: pointer;
}
.stickers { display: flex; flex-wrap: wrap; gap: 10px; }
.sticker {
  border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; display: grid; gap: 2px;
  box-shadow: 3px 3px 0 var(--teal); font: 700 12px/1.1 var(--talk);
}
.sticker:nth-child(even) { transform: rotate(2deg); box-shadow: 3px 3px 0 var(--yellow); }
.sticker:nth-child(odd) { transform: rotate(-2deg); }
.sticker strong { font: 20px/1 var(--shout); font-variant-numeric: tabular-nums; }
ol.rows, ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rows button, .rows .claim {
  width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  font: 14px/1.35 var(--read); color: var(--ink); background: none; border: 0; border-radius: 8px; padding: 6px 6px;
}
.rows button { cursor: pointer; }
.rows button:hover, .rows .claim:hover { background: var(--soft); }
.rows .name { font: 700 14px/1.25 var(--talk); }
.rows .num { font: 700 12px/1 var(--talk); color: var(--text); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: 4px; }
.bar.far i { background: var(--pink); }
.small { font: 700 12px/1.3 var(--talk); color: var(--text); }
.flag { font: 700 11px/1 var(--talk); border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 6px;
  margin-left: 4px; white-space: nowrap; }
.claim .txt { min-width: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .pill, .chip { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1 class="banner">🗺️ Motif map</h1>
    <p class="lede">Every motif sits where the average meaning of its claims puts it. Close dots tell similar stories. Tap one to see its claims pulled toward its centre.</p>
  </header>

  <div class="controls" role="group" aria-label="Map controls">
    <div class="seg" id="spaces" role="group" aria-label="Which space"></div>
    <input type="search" id="find" placeholder="🔎 Find a motif…" aria-label="Find a motif by name or note">
    <select id="group" aria-label="Pick out a group"><option value="">🧺 Any group</option></select>
    <label class="tick"><input type="checkbox" id="showClaims"> 💬 All claims</label>
    <label class="tick"><input type="checkbox" id="showLinks"> 🔗 All links</label>
  </div>
  <div class="seg" id="genres" role="group" aria-label="Pick out a genre"></div>

  <div class="stage">
    <div class="mapcard" id="mapcard">
      <canvas id="map" aria-label="Map of motifs: each dot a motif, placed by the meaning of its claims"></canvas>
      <div class="counts" id="counts"></div>
      <div class="zoombtns">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zreset" aria-label="Show the whole map">⤢</button>
      </div>
      <div class="legend" id="legend" aria-hidden="true"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script id="map-data" type="application/json">__MAP_DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('map-data').textContent);
  // the site's genre colors (app/site/boards.py GENRE_INK): five big genres, the rest white and known by their emoji
  const GENRE_INK = {Archetypes: '#e87ba4', Plots: '#a0522d', Beliefs: '#7a8a00', Theories: '#8a5cff', Arguments: '#eda100'};
  const GENRE_EMOJI = {Archetypes: '🎭', Plots: '📜', Beliefs: '🪨', Theories: '🕵️', Arguments: '🗣️', Values: '⚖️',
    Exhortations: '📣', Perennials: '🌻'};
  const SPACE_LABEL = {'qwen3 8b': '🧠 Qwen3 8B', 'mxbai': '🧪 mxbai (filing’s centre)', 'tfidf': '🔤 Words (TF-IDF)'};
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const INK = css('--ink'), PINK = css('--pink'), YELLOW = css('--yellow'), TEAL = css('--teal'), PURPLE = css('--purple');

  const M = D.motifs.map((m, i) => ({...m, i, claims: []}));
  const C = D.claims;
  C.forEach((c, ci) => c.m.forEach(([mi, ok, d]) => M[mi].claims.push({ci, ok: !!ok, d})));
  const related = new Map(M.map(m => [m.i, new Set()]));
  D.related.forEach(([a, b]) => { related.get(a).add(b); related.get(b).add(a); });
  const restedOn = new Map(M.map(m => [m.i, new Set()]));
  M.forEach(m => m.rests.forEach(p => restedOn.get(p).add(m.i)));
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));

  const state = {space: D.spaces[0], sel: null, hover: null, hoverClaim: null, genre: null, group: '', q: '',
    showClaims: false, showLinks: false, focusClaim: null};
  try { const s = localStorage.getItem('motifmap.space'); if (D.spaces.includes(s)) state.space = s; } catch (e) {}

  // ---- controls
  const spaces = document.getElementById('spaces');
  D.spaces.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill'; b.textContent = SPACE_LABEL[s] || s; b.dataset.s = s;
    b.addEventListener('click', () => { state.space = s; try { localStorage.setItem('motifmap.space', s); } catch (e) {}
      syncSpaces(); renderPanel(); draw(); });
    spaces.appendChild(b);
  });
  function syncSpaces() { spaces.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === state.space)); }
  syncSpaces();

  const genres = document.getElementById('genres');
  const genreCount = {};
  M.forEach(m => { genreCount[m.genre || '—'] = (genreCount[m.genre || '—'] || 0) + 1; });
  D.genres.forEach(g => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.g = g; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `${GENRE_EMOJI[g] || ''} ${esc(g)} <span class="small">${genreCount[g] || 0}</span>`;
    b.addEventListener('click', () => { state.genre = state.genre === g ? null : g;
      genres.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === state.genre)); draw(); });
    genres.appendChild(b);
  });

  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(GENRE_INK).map(([g, c]) =>
    `<span><span class="swatch" style="background:${c}"></span>${GENRE_EMOJI[g]} ${g}</span>`).join('') +
    `<span><span class="swatch" style="background:#fff"></span>others white</span>`;

  const groupSel = document.getElementById('group');
  Object.entries(D.groups).sort((a, b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
    const n = M.filter(m => m.groups.includes(id)).length;
    if (!n) return;
    const o = document.createElement('option'); o.value = id; o.textContent = `${name} (${n})`; groupSel.appendChild(o);
  });
  groupSel.addEventListener('change', () => { state.group = groupSel.value; draw(); });
  const find = document.getElementById('find');
  find.addEventListener('input', () => { state.q = find.value.trim().toLowerCase(); draw(); });
  find.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const hit = M.find(m => matches(m) && m.xy && m.xy[state.space]);
    if (hit) select(hit.i, true);
  });
  document.getElementById('showClaims').addEventListener('change', e => { state.showClaims = e.target.checked; draw(); });
  document.getElementById('showLinks').addEventListener('change', e => { state.showLinks = e.target.checked; draw(); });

  function matches(m) {
    if (state.genre && m.genre !== state.genre) return false;
    if (state.group && !m.groups.includes(state.group)) return false;
    if (state.q && !(m.name.toLowerCase().includes(state.q) || m.note.toLowerCase().includes(state.q) ||
                     m.id.toLowerCase() === state.q)) return false;
    return true;
  }
  const filtering = () => !!(state.genre || state.group || state.q);

  // ---- canvas, zoom
  const card = document.getElementById('mapcard'), canvas = document.getElementById('map'), ctx = canvas.getContext('2d');
  const tip = document.getElementById('tip');
  let W = 0, H = 0, T = d3.zoomIdentity;
  const PAD = 30;
  function base(p) {  // data (0..1000) to unzoomed screen, keeping the aspect
    const s = Math.min(W - 2 * PAD, H - 2 * PAD) / 1000;
    return [(W - 1000 * s) / 2 + p[0] * s, (H - 1000 * s) / 2 + p[1] * s];
  }
  const scr = p => { const b = base(p); return [T.applyX(b[0]), T.applyY(b[1])]; };
  function resize() {
    const r = card.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
  }
  const zoom = d3.zoom().scaleExtent([0.7, 60]).on('zoom', e => { T = e.transform; draw(); });
  const sel = d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  document.getElementById('zin').onclick = () => sel.transition().duration(250).call(zoom.scaleBy, 1.8);
  document.getElementById('zout').onclick = () => sel.transition().duration(250).call(zoom.scaleBy, 1 / 1.8);
  document.getElementById('zreset').onclick = () => sel.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
  new ResizeObserver(resize).observe(card);

  const radius = m => Math.min(15, 2.6 + Math.sqrt(m.claims.length) * 1.15) * Math.min(1.7, Math.sqrt(T.k));

  function line(a, b, color, width, dash) {
    ctx.beginPath(); ctx.setLineDash(dash || []); ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]);
  }
  function dot(p, r, fill, stroke, sw) {
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1; ctx.stroke(); }
  }
  function label(p, text, size, placed) {
    ctx.font = `700 ${size}px 'Comic Neue', 'Comic Sans MS', cursive`;
    const w = ctx.measureText(text).width, x = p[0] + 8, y = p[1] - 6;
    const box = [x - 2, y - size, x + w + 2, y + 4];
    if (placed && placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) return;
    if (placed) placed.push(box);
    ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(text, x, y);
    ctx.fillStyle = INK; ctx.fillText(text, x, y);
  }

  function draw() {
    if (!W) return;
    const sp = state.space;
    ctx.clearRect(0, 0, W, H);
    const on = M.filter(m => m.xy && m.xy[sp]);
    const pos = new Map(on.map(m => [m.i, scr(m.xy[sp])]));
    const f = filtering();
    const hit = new Set(on.filter(matches).map(m => m.i));
    document.getElementById('counts').textContent = f
      ? `${hit.size} of ${on.length} motifs picked out` : `${on.length} motifs · ${C.length} claims`;

    if (state.showLinks) {
      D.related.forEach(([a, b]) => { if (pos.has(a) && pos.has(b)) line(pos.get(a), pos.get(b), 'rgba(0,194,168,.35)', 1); });
      M.forEach(m => m.rests.forEach(p => { if (pos.has(m.i) && pos.has(p)) line(pos.get(m.i), pos.get(p), 'rgba(138,92,255,.35)', 1); }));
    }
    if (state.showClaims) {
      ctx.fillStyle = 'rgba(31,31,46,.22)';
      C.forEach(c => { const xy = c.xy[sp]; if (!xy) return; const p = scr(xy); ctx.fillRect(p[0] - 1.2, p[1] - 1.2, 2.4, 2.4); });
    }
    const S = state.sel != null ? M[state.sel] : null;
    if (S && pos.has(S.i)) {
      const c0 = pos.get(S.i);
      related.get(S.i).forEach(j => pos.has(j) && line(c0, pos.get(j), TEAL, 2, [6, 4]));
      S.rests.forEach(j => pos.has(j) && line(c0, pos.get(j), PURPLE, 2.5));
      restedOn.get(S.i).forEach(j => pos.has(j) && line(c0, pos.get(j), PURPLE, 1.5, [2, 3]));
      S.claims.forEach(({ci}) => { const xy = C[ci].xy[sp]; if (xy) line(scr(xy), c0, 'rgba(31,31,46,.35)', 1); });
    }
    // motifs, small first so big ones sit on top
    const order = on.slice().sort((a, b) => b.claims.length - a.claims.length).reverse();
    order.forEach(m => {
      if (S && m.i === S.i) return;
      const p = pos.get(m.i), dim = f && !hit.has(m.i);
      ctx.globalAlpha = dim ? 0.16 : 1;
      dot(p, radius(m), GENRE_INK[m.genre] || '#ffffff', INK, f && !dim ? 2 : 1.1);
      ctx.globalAlpha = 1;
    });
    if (S && pos.has(S.i)) {
      S.claims.forEach(({ci, ok}) => {
        const xy = C[ci].xy[sp]; if (!xy) return;
        const p = scr(xy), focus = state.focusClaim === ci;
        dot(p, focus ? 6 : 3.6, ok ? INK : '#fff', INK, 1.5);
        if (focus) dot(p, 9, null, PINK, 2.5);
      });
      const p = pos.get(S.i), r = radius(S) + 3;
      dot([p[0] + 3, p[1] + 3], r, INK);
      dot(p, r, YELLOW, INK, 2.5);
    }
    if (state.hoverClaim != null) {
      const xy = C[state.hoverClaim].xy[sp]; if (xy) dot(scr(xy), 5, PINK, INK, 1.5);
    }
    // labels: the chosen one and its nearest, what's hovered, a small pick, and everything once zoomed in
    const placed = [];
    if (S && pos.has(S.i)) {
      label(pos.get(S.i), S.name, 15, placed);
      ((S.near || {})[sp] || []).slice(0, 5).forEach(([j]) => pos.has(j) && label(pos.get(j), M[j].name, 12, placed));
    }
    if (state.hover != null && pos.has(state.hover)) label(pos.get(state.hover), M[state.hover].name, 13, placed);
    if (f && hit.size <= 40) hit.forEach(i => label(pos.get(i), M[i].name, 12, placed));
    if (T.k >= 3) {
      order.slice().reverse().forEach(m => {
        const p = pos.get(m.i);
        if (p[0] < 0 || p[1] < 0 || p[0] > W || p[1] > H || (f && !hit.has(m.i))) return;
        label(p, m.name, 11, placed);
      });
    }
  }

  // ---- hover and click
  function nearest(px, py) {
    const sp = state.space; let best = null, bd = Infinity;
    M.forEach(m => { if (!m.xy || !m.xy[sp]) return; const p = scr(m.xy[sp]);
      const d = Math.hypot(p[0] - px, p[1] - py) - radius(m); if (d < bd) { bd = d; best = m.i; } });
    return bd <= 8 ? best : null;
  }
  function nearestClaim(px, py) {
    const sp = state.space; let best = null, bd = Infinity;
    const pool = state.showClaims ? C.map((c, ci) => ci) : (state.sel != null ? M[state.sel].claims.map(c => c.ci) : []);
    pool.forEach(ci => { const xy = C[ci].xy[sp]; if (!xy) return; const p = scr(xy);
      const d = Math.hypot(p[0] - px, p[1] - py); if (d < bd) { bd = d; best = ci; } });
    return bd <= 6 ? best : null;
  }
  function showTip(px, py, html) {
    tip.innerHTML = html; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(W - w - 8, Math.max(8, px + 14)) + 'px';
    tip.style.top = Math.min(H - h - 8, Math.max(8, py + 14)) + 'px';
  }
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const m = nearest(px, py), c = m == null ? nearestClaim(px, py) : null;
    const changed = m !== state.hover || c !== state.hoverClaim;
    state.hover = m; state.hoverClaim = c;
    canvas.classList.toggle('over', m != null || c != null);
    if (m != null) {
      const x = M[m];
      showTip(px, py, `<b>${GENRE_EMOJI[x.genre] || ''} ${esc(x.name)}</b>${esc(x.genre || 'no genre')} · ${x.claims.length} claim${x.claims.length === 1 ? '' : 's'}`);
    } else if (c != null) {
      const names = C[c].m.map(([mi]) => M[mi].name).join(', ');
      showTip(px, py, `${esc(C[c].t)}<br><span class="small">in ${esc(names)}</span>`);
    } else tip.hidden = true;
    if (changed) draw();
  });
  canvas.addEventListener('pointerleave', () => { tip.hidden = true; state.hover = null; state.hoverClaim = null; draw(); });
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const m = nearest(px, py);
    if (m != null) return select(m, false);
    const c = nearestClaim(px, py);
    if (c != null) { if (state.sel == null || !C[c].m.some(([mi]) => mi === state.sel)) select(C[c].m[0][0], false);
      state.focusClaim = c; renderPanel(); draw(); return; }
    select(null);
  });

  function select(i, fly) {
    state.sel = i; state.focusClaim = null; renderPanel(); draw();
    if (i != null && fly && M[i].xy && M[i].xy[state.space]) {
      const b = base(M[i].xy[state.space]), k = Math.max(T.k, 3);
      sel.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - b[0] * k, H / 2 - b[1] * k).scale(k));
    }
    if (window.matchMedia('(max-width: 960px)').matches && i != null) document.getElementById('panel').scrollIntoView({block: 'nearest'});
  }

  // ---- the panel
  const panel = document.getElementById('panel');
  const loose = M.filter(m => m.claims.length >= 3 && m.spread > -1).sort((a, b) => a.spread - b.spread);
  const pct = m => Math.round(100 * loose.filter(x => x.spread < m.spread).length / Math.max(1, loose.length));
  const row = (m, right) => `<li><button data-m="${m.i}"><span class="name">${GENRE_EMOJI[m.genre] || '·'} ${esc(m.name)}</span><span class="num">${right}</span></button></li>`;

  function renderPanel() {
    const sp = state.space;
    if (state.sel == null) {
      panel.innerHTML = `
        <div class="stickers">
          <div class="sticker"><span>🧩 motifs</span><strong>${M.length.toLocaleString()}</strong></div>
          <div class="sticker"><span>💬 claims</span><strong>${C.length.toLocaleString()}</strong></div>
          <div class="sticker"><span>🕰️ built</span><strong style="font-size:14px">${esc(D.built.replace('T', ' '))}</strong></div>
        </div>
        <p>Each motif’s centre is the average of its confirmed claims, squashed from hundreds of dimensions down to two. Nearby dots usually tell similar stories, but distance on the screen is only a rough guide: the neighbour list in each motif is the true measure.</p>
        <h3>🌀 Loosest motifs</h3>
        <p class="small">Motifs of 3+ claims whose claims sit farthest from their own centre (average likeness, in Qwen3 8B). A loose motif may hold two tellings, or claims filed in the wrong place.</p>
        <ol class="rows">${loose.slice(0, 12).map(m => row(m, m.spread.toFixed(2))).join('')}</ol>
        <h3>🎯 Tightest motifs</h3>
        <ol class="rows">${loose.slice(-6).reverse().map(m => row(m, m.spread.toFixed(2))).join('')}</ol>`;
    } else {
      const m = M[state.sel];
      const claims = m.claims.slice().sort((a, b) => (a.d ?? 2) - (b.d ?? 2));
      const ds = claims.map(c => c.d).filter(d => d != null);
      const lo = Math.min(...ds, 0.3), hi = Math.max(...ds, 0.9);
      const near = (m.near || {})[sp] || [];
      const tags = j => (related.get(m.i).has(j) ? '<span class="flag">related</span>' : '') +
        (m.rests.includes(j) ? '<span class="flag">rests on</span>' : '') + (restedOn.get(m.i).has(j) ? '<span class="flag">rests on this</span>' : '');
      const groups = m.groups.map(g => `<span class="tag">🧺 ${esc(D.groups[g] || g)}</span>`).join('');
      const tight = m.claims.length >= 3 && m.spread > -1
        ? `<p class="small">Its claims average ${m.spread.toFixed(2)} likeness to the centre: tighter than ${pct(m)}% of motifs with 3+ claims.</p>` : '';
      const where = m.xy && m.xy[sp] ? '' : `<p class="small">Not on this map: none of its claims has a ${esc(SPACE_LABEL[sp] || sp)} vector.</p>`;
      panel.innerHTML = `
        <button class="back" id="back">← All motifs</button>
        <h2>${esc(m.name)}</h2>
        <div class="meta"><span class="tag tilt">${GENRE_EMOJI[m.genre] || '❔'} ${esc(m.genre || 'no genre')}</span>
          <span class="tag">${esc(m.id)}</span>${m.done ? '' : '<span class="tag">✏️ not marked done</span>'}${groups}</div>
        ${m.note ? `<p>${esc(m.note)}</p>` : ''}
        ${tight}${where}
        <h3>💬 Claims, farthest from the centre first</h3>
        <ul class="rows">${claims.map(c => {
          const w = c.d == null ? 0 : Math.round(100 * (c.d - lo) / Math.max(0.01, hi - lo));
          const farClass = c.d != null && c.d < lo + (hi - lo) * 0.35 ? ' far' : '';
          const others = C[c.ci].m.filter(([mi]) => mi !== m.i).map(([mi]) => M[mi].name);
          return `<li><div class="claim" data-c="${c.ci}"><span class="txt">${esc(C[c.ci].t)}${c.ok ? '' : '<span class="flag">unchecked</span>'}${others.length ? `<br><span class="small">also in ${esc(others.join(', '))}</span>` : ''}</span><span class="num">${c.d == null ? '—' : c.d.toFixed(2)}</span><span class="bar${farClass}"><i style="width:${Math.max(3, w)}%"></i></span></div></li>`;
        }).join('')}</ul>
        <h3>🧲 Nearest centres</h3>
        <p class="small">In ${esc(SPACE_LABEL[sp] || sp)}. Likeness runs from 0 (nothing alike) to 1 (the same).</p>
        <ol class="rows">${near.map(([j, s]) => `<li><button data-m="${j}"><span class="name">${GENRE_EMOJI[M[j].genre] || '·'} ${esc(M[j].name)}${tags(j)}</span><span class="num">${s.toFixed(2)}</span></button></li>`).join('')}</ol>`;
      panel.querySelector('#back').onclick = () => select(null);
      panel.querySelectorAll('.claim').forEach(el => {
        el.addEventListener('pointerenter', () => { state.focusClaim = +el.dataset.c; draw(); });
        el.addEventListener('pointerleave', () => { state.focusClaim = null; draw(); });
      });
    }
    panel.querySelectorAll('button[data-m]').forEach(b => b.addEventListener('click', () => select(+b.dataset.m, true)));
  }

  renderPanel();
  resize();
  const h = location.hash.slice(1).toUpperCase();
  const start = M.find(m => m.id === h);
  if (start) setTimeout(() => select(start.i, true), 50);
})();
</script>
